<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="Connect with CR8 Autos in Watervliet, NY. Submit an estimate, book an appointment, or leave a Google review.">
  <title>CR8 Autos | Estimates, Appointments & Reviews</title>
  <link rel="icon" href="logo-header-transparent.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202023; background: #eeefec; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    a:focus-visible { outline: 3px solid #1569c7; outline-offset: 4px; }
    .page { width: 100%; max-width: 440px; min-height: min(640px, 100svh); padding: 32px 28px 20px; background: #f7f7f5; display: flex; flex-direction: column; justify-content: space-between; border-top: 4px solid #e52b36; }
    .logo { display: block; width: 200px; height: 110px; object-fit: contain; margin: 0 auto; mix-blend-mode: multiply; }
    nav { display: grid; gap: 14px; margin: 28px 0; }
    .action { min-height: 64px; padding: 18px 12px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 18px; font-weight: 650; line-height: 1.3; border: 1px solid #d9d9d6; border-radius: 10px; background: #fff; }
    .action:hover { background: #f0f0ed; }
    .action.primary { background: #cf2430; border-color: #cf2430; color: #fff; }
    .action.primary:hover { background: #b61b26; }
    .action.dark { background: #222225; border-color: #222225; color: #fff; }
    .action.dark:hover { background: #38383c; }
    footer { text-align: center; }
    address { font-style: normal; font-size: 14px; line-height: 1.5; }
    .address { display: inline-block; padding: 4px 10px; }
    .phone { display: inline-flex; align-items: center; min-height: 44px; font-size: 17px; font-weight: 700; }
    .credit { border-top: 1px solid #deded9; padding-top: 16px; margin-top: 12px; }
    .credit a { display: inline-block; font-size: 9px; line-height: 1.6; letter-spacing: .7px; color: #69696d; padding: 4px 0; }
    .credit strong { color: #28282c; font-weight: 750; }
    .credit a:hover strong { color: #cf2430; }
    @media (min-width: 600px) { .page { margin: 24px; border-radius: 16px; box-shadow: 0 20px 70px #1818180d; } }
    @media (max-width: 599px) { .page { min-height: 100svh; padding-top: max(28px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); } }
    @media (max-height: 590px) { .page { padding: 14px 20px max(10px, env(safe-area-inset-bottom)); } .logo { width: 145px; height: 80px; } nav { margin: 16px 0; gap: 10px; } .action { min-height: 58px; padding: 16px 12px; font-size: 17px; } .credit { padding-top: 10px; margin-top: 6px; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <img class="logo" src="logo-header-transparent.png" alt="CR8 Autos — Body Shop & Repair" width="174" height="96">
    </header>
    <nav aria-label="CR8 Autos services">
      <a class="action primary" href="https://cr8autos.com/#damage-estimator">Submit an estimate</a>
      <a class="action dark" href="https://cr8autos.com/booking.html">Book an appointment</a>
      <a class="action" id="review-link" href="https://search.google.com/local/writereview?placeid=ChIJp2C3EJIP3okRA9oRxmBhswE" target="_blank" rel="noopener noreferrer">Leave a review</a>
    </nav>
    <footer>
      <address>
        <a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=2603+2nd+Ave+Watervliet+NY+12189" target="_blank" rel="noopener noreferrer" aria-label="Get directions to 2603 2nd Ave, Watervliet, NY 12189">
          <span>2603 2nd Ave<br>Watervliet, NY 12189</span>
        </a><br>
        <a class="phone" href="tel:+15184956876">(518) 495-6876</a>
      </address>
      <div class="credit"><a href="https://reimagebs.com" target="_blank" rel="noopener noreferrer">Powered by <strong>REIMAGE BUSINESS SOLUTIONS</strong></a></div>
    </footer>
  </main>
</body>
</html>
